name: Monitor de licitaciones

on:
  schedule:
    # Horarios en UTC. Chihuahua es UTC-6 todo el año (México eliminó el
    # horario de verano en 2022), así que estas cuatro corridas caen a las
    # 8:00, 13:00, 18:00 y 22:00 hora local.
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
  # Permite lanzarlo a mano desde la pestaña Actions sin esperar al horario.
  workflow_dispatch:

# Sin esto el job no puede escribir de vuelta el historial ni la página.
permissions:
  contents: write

# Si una corrida se empalma con la anterior, se espera en vez de cancelar:
# cancelar a media escritura dejaría el historial inconsistente.
concurrency:
  group: monitor-licitaciones
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      - name: Revisar el portal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Publicar resultados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vistos.json docs/index.html
          # --quiet devuelve 0 si NO hay cambios: en ese caso no hay nada que subir.
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Revisión $(TZ=America/Chihuahua date '+%Y-%m-%d %H:%M')"
            git push
          fi
